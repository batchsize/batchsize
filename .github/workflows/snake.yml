name: Generate Snake

on:
  schedule:
    # 每 12 小时更新一次（cron 用 UTC 时间）
    - cron: "17 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 推送生成结果到 output 分支需要写权限
      contents: write
    steps:
      # 第三方 Action，钉到完整 commit SHA（= v3.5.0）。
      # 标签可以被移动，SHA 不行 —— 升级时手动改这里。
      - name: Generate snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # snk 在容器里跑，dist 归 root，runner 无法在其中 git init。
      # 所以另建一个自己拥有的目录，只读复制产物过去。
      - name: Push to output branch
        run: |
          mkdir -p publish
          cp dist/*.svg publish/
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: regenerate contribution snake"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
